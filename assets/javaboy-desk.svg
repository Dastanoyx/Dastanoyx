<tspan fill="#6E7681"> --- </tspan>
<tspan fill="#C9D1D9">Starting JavaBoyApplication on </tspan>
<tspan fill="#F89820">tunisia-dev</tspan>
<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3331;0.35;0.9;1" dur="13.0s" repeatCount="indefinite"/></text>
