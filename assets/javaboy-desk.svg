<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3977;0.4146;0.9;1" dur="13.0s" repeatCount="indefinite"/></text>
    <text x="62" y="411" class="m" font-size="14" xml:space="preserve" opacity="0">
<tspan fill="#58A6FF">INFO</tspan>
<tspan fill="#6E7681"> --- </tspan>
<tspan fill="#C9D1D9">Tomcat started on port(s): </tspan>
<tspan fill="#F89820">8080 (http)</tspan>
<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.43;0.4469;0.9;1" dur="13.0s" repeatCount="indefinite"/></text>
    <text x="62" y="432" class="m" font-size="14" xml:space="preserve" opacity="0">
<tspan fill="#58A6FF">INFO</tspan>
<tspan fill="#6E7681"> --- </tspan>
<tspan fill="#C9D1D9">Started JavaBoyApplication in </tspan>
<tspan fill="#3FB950">0.42s</tspan>
<tspan fill="#3FB950">  ✔</tspan>
<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4623;0.4792;0.9;1" dur="13.0s" repeatCount="indefinite"/></text>
    <text x="62" y="474" class="m" font-size="14" xml:space="preserve" opacity="0">
<tspan fill="#3FB950">$ </tspan>
<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4946;0.5115;0.9;1" dur="13.0s" repeatCount="indefinite"/></text>
    <rect x="79" y="462" width="9" height="16" fill="#F89820" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;1;0;1;0"
        keyTimes="0;0.4946;0.5177;0.5562;0.5946;0.6331;0.6715;1"
        dur="13.0s" repeatCount="indefinite"/>
    </rect>
