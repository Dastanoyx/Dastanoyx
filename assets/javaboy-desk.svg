<tspan fill="#6E7681">        (v2026.7 · JDK 21 · Spring Boot 3.5)</tspan>
<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3008;0.3177;0.9;1" dur="13.0s" repeatCount="indefinite"/></text>
    <text x="62" y="348" class="m" font-size="14" xml:space="preserve" opacity="0">
