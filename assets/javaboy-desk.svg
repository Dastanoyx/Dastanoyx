<tspan fill="#F89820">      ██  ██    ██  ██    ██  ██    ██  ██    ██  ██    ██  ██    ██</tspan>
<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1715;0.1885;0.9;1" dur="13.0s" repeatCount="indefinite"/></text>
    <text x="62" y="243" class="m" font-size="14" xml:space="preserve" opacity="0">
<tspan fill="#F89820">      ██  ████████  ██    ██  ████████  ██████    ██    ██    ████</tspan>
<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2038;0.2208;0.9;1" dur="13.0s" repeatCount="indefinite"/></text>
    <text x="62" y="264" class="m" font-size="14" xml:space="preserve" opacity="0">
<tspan fill="#F89820">██    ██  ██    ██  ██    ██  ██    ██  ██    ██  ██    ██      ██</tspan>
<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2362;0.2531;0.9;1" dur="13.0s" repeatCount="indefinite"/></text>
    <text x="62" y="285" class="m" font-size="14" xml:space="preserve" opacity="0">
<tspan fill="#F89820">  ████    ██    ██    ████    ██    ██  ██████      ████        ██</tspan>
<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2685;0.2854;0.9;1" dur="13.0s" repeatCount="indefinite"/></text>
