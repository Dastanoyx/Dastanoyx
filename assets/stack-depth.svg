<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-label="How deep I go in each part of the stack">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/><stop offset="100%" stop-color="#10151C"/>
    </linearGradient>
    <linearGradient id="top3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5382A1"/><stop offset="50%" stop-color="#F89820"/><stop offset="100%" stop-color="#E76F00"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <style>
      .lbl  { font-family: ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
      .mono { font-family: ui-monospace,SFMono-Regular,"JetBrains Mono",Consolas,monospace; }
      .h1   { fill:#F0F6FC; font-size:23px; font-weight:700; }
      .sub  { fill:#8B949E; font-size:13px; }
      .row  { fill:#F0F6FC; font-size:14px; font-weight:600; }
      .cat  { font-size:11.5px; }
      .tag  { fill:#6E7681; font-size:10px; letter-spacing:1.4px; }
      .track{ fill:#0D1117; stroke:#21262D; }
      @keyframes sweep { 0%{transform:translateX(-140px)} 100%{transform:translateX(720px)} }
      .shine { animation:sweep 3.6s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1100" height="520" fill="url(#bg3)"/>
  <rect x="0" y="0" width="1100" height="4" fill="url(#top3)"/>

  <text x="40" y="46" class="lbl h1">Stack, by how deep I actually go</text>
  <text x="40" y="68" class="lbl sub">Honest version — bar length is depth of use, not a self-assigned score out of ten.</text>

  <g class="lbl">
    <!-- Java -->
    <text x="40" y="119" class="row">Java 17 / 21</text>
    <rect class="track" x="250" y="104" width="620" height="20" rx="6"/>
    <rect x="252" y="106" height="16" rx="5" fill="#F89820" width="0">
      <animate attributeName="width" from="0" to="616" dur="1.1s" begin="0.05s" fill="freeze"/></rect>
    <text x="890" y="119" class="cat" fill="#F89820">daily driver</text>

    <!-- Spring -->
    <text x="40" y="163" class="row">Spring Boot / Cloud</text>
    <rect class="track" x="250" y="148" width="620" height="20" rx="6"/>
    <rect x="252" y="150" height="16" rx="5" fill="#F89820" width="0">
      <animate attributeName="width" from="0" to="600" dur="1.1s" begin="0.15s" fill="freeze"/></rect>
    <text x="890" y="163" class="cat" fill="#F89820">daily driver</text>

    <!-- Postgres -->
    <text x="40" y="207" class="row">PostgreSQL + JPA</text>
    <rect class="track" x="250" y="192" width="620" height="20" rx="6"/>
    <rect x="252" y="194" height="16" rx="5" fill="#F89820" width="0">
      <animate attributeName="width" from="0" to="560" dur="1.1s" begin="0.25s" fill="freeze"/></rect>
    <text x="890" y="207" class="cat" fill="#F89820">daily driver</text>

    <!-- Kafka -->
    <text x="40" y="251" class="row">Kafka / event-driven</text>
    <rect class="track" x="250" y="236" width="620" height="20" rx="6"/>
    <rect x="252" y="238" height="16" rx="5" fill="#5382A1" width="0">
      <animate attributeName="width" from="0" to="480" dur="1.1s" begin="0.35s" fill="freeze"/></rect>
    <text x="890" y="251" class="cat" fill="#5382A1">production</text>

    <!-- Docker/K8s -->
    <text x="40" y="295" class="row">Docker / Kubernetes</text>
    <rect class="track" x="250" y="280" width="620" height="20" rx="6"/>
    <rect x="252" y="282" height="16" rx="5" fill="#5382A1" width="0">
      <animate attributeName="width" from="0" to="440" dur="1.1s" begin="0.45s" fill="freeze"/></rect>
    <text x="890" y="295" class="cat" fill="#5382A1">production</text>

    <!-- CI/CD -->
    <text x="40" y="339" class="row">CI/CD + SonarQube</text>
    <rect class="track" x="250" y="324" width="620" height="20" rx="6"/>
    <rect x="252" y="326" height="16" rx="5" fill="#5382A1" width="0">
      <animate attributeName="width" from="0" to="420" dur="1.1s" begin="0.55s" fill="freeze"/></rect>
    <text x="890" y="339" class="cat" fill="#5382A1">production</text>

    <!-- Angular -->
    <text x="40" y="383" class="row">Angular + TypeScript</text>
    <rect class="track" x="250" y="368" width="620" height="20" rx="6"/>
    <rect x="252" y="370" height="16" rx="5" fill="#3FB950" width="0">
      <animate attributeName="width" from="0" to="330" dur="1.1s" begin="0.65s" fill="freeze"/></rect>
    <text x="890" y="383" class="cat" fill="#3FB950">comfortable</text>

    <!-- Python -->
    <text x="40" y="427" class="row">Python / pandas / sklearn</text>
    <rect class="track" x="250" y="412" width="620" height="20" rx="6"/>
    <rect x="252" y="414" height="16" rx="5" fill="#3FB950" width="0">
      <animate attributeName="width" from="0" to="300" dur="1.1s" begin="0.75s" fill="freeze"/></rect>
    <text x="890" y="427" class="cat" fill="#3FB950">comfortable</text>

    <!-- JVM tuning -->
    <text x="40" y="471" class="row">JVM tuning + tracing</text>
    <rect class="track" x="250" y="456" width="620" height="20" rx="6"/>
    <rect x="252" y="458" height="16" rx="5" fill="#A371F7" width="0">
      <animate attributeName="width" from="0" to="250" dur="1.1s" begin="0.85s" fill="freeze"/></rect>
    <text x="890" y="471" class="cat" fill="#A371F7">actively learning</text>
  </g>

  <!-- roaming shine over the bars -->
  <g clip-path="none" opacity=".9">
    <rect class="shine" x="250" y="100" width="120" height="380" fill="url(#shine)"/>
  </g>

  <text x="40" y="503" class="mono tag">DEPTH OF USE — NOT A SCORE OUT OF TEN</text>
  <text x="1060" y="503" text-anchor="end" class="mono tag">github.com/Dastanoyx</text>
</svg>
