<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" role="img" aria-label="Event-driven fintech architecture diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#0E1420"/>
      <stop offset="100%" stop-color="#10151C"/>
    </linearGradient>
    <linearGradient id="javaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5382A1"/>
      <stop offset="50%" stop-color="#F89820"/>
      <stop offset="100%" stop-color="#E76F00"/>
    </linearGradient>
    <linearGradient id="kafkaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5382A1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#007396" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text  { font-family: -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
      .title{ fill:#F0F6FC; font-size:27px; font-weight:700; }
      .sub  { fill:#8B949E; font-size:15px; }
      .name { fill:#F0F6FC; font-size:17px; font-weight:700; }
      .meta { fill:#9BA5B0; font-size:13px; }
      .tag  { fill:#7D8590; font-size:12px; font-weight:600; letter-spacing:1.6px; }
      .lgd  { fill:#9BA5B0; font-size:13px; }
      .flow { fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;
              stroke-dasharray:7 9; animation:dash 1.4s linear infinite; }
      .flow-slow { animation-duration:2.6s; }
      .tele { fill:none; stroke:#A371F7; stroke-width:1.5; stroke-opacity:.55;
              stroke-dasharray:2 7; stroke-linejoin:round;
              animation:dash 2.4s linear infinite reverse; }
      @keyframes dash { to { stroke-dashoffset:-32; } }
    </style>
  </defs>

  <rect width="1100" height="700" fill="url(#bg)"/>
  <rect x="0" y="0" width="1100" height="5" fill="url(#javaGrad)"/>

  <text x="40" y="50" class="title">Event-Driven Fintech Platform</text>
  <text x="40" y="74" class="sub">The shape of almost every system I build — small services, one event backbone, nothing that fails alone.</text>

  <!-- ─────────── EDGES ─────────── -->
  <g>
    <path class="flow" d="M170,290 H205" stroke="#5382A1"/>
    <path class="flow" d="M345,290 C370,290 368,178 390,178" stroke="#5382A1"/>
    <path class="flow" d="M345,290 H390" stroke="#5382A1"/>
    <path class="flow" d="M345,290 C370,290 368,418 390,418" stroke="#5382A1"/>
    <path class="flow" d="M550,178 C575,178 578,200 595,215" stroke="#F89820"/>
    <path class="flow" d="M550,298 H595" stroke="#F89820"/>
    <path class="flow" d="M550,418 C575,418 578,396 595,382" stroke="#F89820"/>
    <path class="flow" d="M665,215 C685,200 690,178 710,178" stroke="#E76F00"/>
    <path class="flow" d="M665,298 H710" stroke="#E76F00"/>
    <path class="flow" d="M665,382 C685,396 690,408 710,408" stroke="#E76F00"/>
    <path class="flow flow-slow" d="M410,215 V236 H367 V500 H310 V545" stroke="#3FB950"/>
    <path class="flow flow-slow" d="M530,335 V352 H572 V515 H490 V545" stroke="#3FB950"/>
    <path class="flow flow-slow" d="M520,455 V530 H750 V545" stroke="#3FB950"/>
    <path class="flow flow-slow" d="M760,215 V535 H570 V545" stroke="#3FB950"/>
    <path class="flow flow-slow" d="M800,445 V545" stroke="#3FB950"/>
    <path class="tele" d="M275,240 V95 H1000 V250"/>
    <path class="tele" d="M470,140 V95"/>
    <path class="tele" d="M630,140 V95"/>
    <path class="tele" d="M870,177 C888,177 892,210 900,268"/>
    <path class="tele" d="M870,298 H900"/>
    <path class="tele" d="M870,408 C888,408 892,388 900,372"/>
  </g>

  <!-- ─────────── PACKETS ─────────── -->
  <g>
    <circle r="5" fill="#5382A1" filter="url(#glow)">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M170,290 H205"/>
    </circle>
    <circle r="5" fill="#F89820" filter="url(#glow)">
      <animateMotion dur="3.4s" repeatCount="indefinite" begin="0.2s"
        path="M345,290 C370,290 368,178 390,178 M550,178 C575,178 578,200 595,215"/>
    </circle>
    <circle r="5" fill="#F89820" filter="url(#glow)">
      <animateMotion dur="3.4s" repeatCount="indefinite" begin="1.4s" path="M345,290 H390 M550,298 H595"/>
    </circle>
    <circle r="5" fill="#E76F00" filter="url(#glow)">
      <animateMotion dur="2.8s" repeatCount="indefinite" begin="0.6s" path="M665,215 C685,200 690,178 710,178"/>
    </circle>
    <circle r="5" fill="#E76F00" filter="url(#glow)">
      <animateMotion dur="2.8s" repeatCount="indefinite" begin="1.6s" path="M665,298 H710"/>
    </circle>
    <circle r="5" fill="#E76F00" filter="url(#glow)">
      <animateMotion dur="2.8s" repeatCount="indefinite" begin="2.2s" path="M665,382 C685,396 690,408 710,408"/>
    </circle>
    <circle r="4.2" fill="#3FB950">
      <animateMotion dur="4.6s" repeatCount="indefinite" path="M410,215 V236 H367 V500 H310 V545"/>
    </circle>
    <circle r="4.2" fill="#3FB950">
      <animateMotion dur="4.6s" repeatCount="indefinite" begin="1.8s" path="M530,335 V352 H572 V515 H490 V545"/>
    </circle>
  </g>

  <!-- ─────────── CLIENT ─────────── -->
  <g>
    <rect x="30" y="248" width="140" height="84" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.6"/>
    <rect x="30" y="248" width="4" height="84" rx="2" fill="#5382A1"/>
    <text x="48" y="278" class="name">Clients</text>
    <text x="48" y="300" class="meta">Angular SPA</text>
    <text x="48" y="320" class="meta">Mobile clients</text>
  </g>

  <!-- ─────────── GATEWAY ─────────── -->
  <g>
    <rect x="205" y="238" width="140" height="104" rx="10" fill="#161B22" stroke="#5382A1" stroke-opacity=".7" stroke-width="1.6"/>
    <rect x="205" y="238" width="4" height="104" rx="2" fill="#5382A1"/>
    <text x="223" y="268" class="name">API Gateway</text>
    <text x="223" y="292" class="meta">JWT auth</text>
    <text x="223" y="312" class="meta">rate limiting</text>
    <text x="223" y="332" class="meta">smart routing</text>
  </g>

  <!-- ─────────── SERVICES ─────────── -->
  <g>
    <text x="390" y="122" class="tag">SPRING BOOT SERVICES</text>

    <rect x="390" y="140" width="160" height="75" rx="10" fill="#161B22" stroke="#F89820" stroke-opacity=".55" stroke-width="1.6"/>
    <rect x="390" y="140" width="4" height="75" rx="2" fill="#F89820"/>
    <text x="408" y="168" class="name">Payments</text>
    <text x="408" y="190" class="meta">idempotent · retryable</text>
    <text x="408" y="208" class="meta">outbox pattern</text>

    <rect x="390" y="260" width="160" height="75" rx="10" fill="#161B22" stroke="#F89820" stroke-opacity=".55" stroke-width="1.6"/>
    <rect x="390" y="260" width="4" height="75" rx="2" fill="#F89820"/>
    <text x="408" y="288" class="name">Accounts</text>
    <text x="408" y="310" class="meta">balances · limits</text>
    <text x="408" y="328" class="meta">optimistic locking</text>

    <rect x="390" y="380" width="160" height="75" rx="10" fill="#161B22" stroke="#F89820" stroke-opacity=".55" stroke-width="1.6"/>
    <rect x="390" y="380" width="4" height="75" rx="2" fill="#F89820"/>
    <text x="408" y="408" class="name">Onboarding</text>
    <text x="408" y="430" class="meta">KYC state machine</text>
    <text x="408" y="448" class="meta">async verification</text>
  </g>

  <!-- ─────────── KAFKA ─────────── -->
  <g>
    <rect x="595" y="140" width="70" height="340" rx="10" fill="url(#kafkaGrad)" stroke="#5382A1" stroke-opacity=".7" stroke-width="1.6"/>
    <text transform="translate(624,410) rotate(-90)" class="name">APACHE KAFKA</text>
    <text transform="translate(646,410) rotate(-90)" class="meta">event backbone</text>
    <g opacity=".8">
      <rect x="612" y="160" width="36" height="4" rx="2" fill="#5382A1">
        <animate attributeName="y" values="160;462;160" dur="4.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="4.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="612" y="160" width="36" height="4" rx="2" fill="#F89820">
        <animate attributeName="y" values="160;462;160" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="612" y="160" width="36" height="4" rx="2" fill="#E76F00">
        <animate attributeName="y" values="160;462;160" dur="4.5s" begin="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="4.5s" begin="3s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- ─────────── CONSUMERS ─────────── -->
  <g>
    <text x="710" y="122" class="tag">EVENT CONSUMERS</text>

    <rect x="710" y="140" width="160" height="75" rx="10" fill="#161B22" stroke="#E76F00" stroke-opacity=".55" stroke-width="1.6"/>
    <rect x="710" y="140" width="4" height="75" rx="2" fill="#E76F00"/>
    <text x="728" y="168" class="name">Ledger</text>
    <text x="728" y="190" class="meta">double-entry</text>
    <text x="728" y="208" class="meta">append-only</text>

    <rect x="710" y="260" width="160" height="75" rx="10" fill="#161B22" stroke="#E76F00" stroke-opacity=".55" stroke-width="1.6"/>
    <rect x="710" y="260" width="4" height="75" rx="2" fill="#E76F00"/>
    <text x="728" y="288" class="name">Fraud Scoring</text>
    <text x="728" y="310" class="meta">rules + ML model</text>
    <text x="728" y="328" class="meta">sub-100ms budget</text>

    <rect x="710" y="370" width="160" height="75" rx="10" fill="#161B22" stroke="#E76F00" stroke-opacity=".55" stroke-width="1.6"/>
    <rect x="710" y="370" width="4" height="75" rx="2" fill="#E76F00"/>
    <text x="728" y="398" class="name">Notifications</text>
    <text x="728" y="420" class="meta">email · SMS · push</text>
    <text x="728" y="438" class="meta">at-least-once</text>
  </g>

  <!-- ─────────── OBSERVABILITY ─────────── -->
  <g>
    <rect x="900" y="250" width="170" height="145" rx="10" fill="#161B22" stroke="#A371F7" stroke-opacity=".5" stroke-width="1.6"/>
    <rect x="900" y="250" width="4" height="145" rx="2" fill="#A371F7"/>
    <text x="918" y="280" class="name">Observability</text>
    <text x="918" y="304" class="meta">structured logs</text>
    <text x="918" y="324" class="meta">distributed traces</text>
    <text x="918" y="344" class="meta">RED / USE metrics</text>
    <text x="918" y="368" class="meta" fill="#A371F7">if I cannot see it,</text>
    <text x="918" y="386" class="meta" fill="#A371F7">I did not ship it</text>
  </g>

  <!-- ─────────── DATA STORES ─────────── -->
  <g>
    <text x="230" y="534" class="tag">PERSISTENCE</text>

    <rect x="230" y="545" width="170" height="64" rx="10" fill="#161B22" stroke="#3FB950" stroke-opacity=".45" stroke-width="1.6"/>
    <text x="250" y="573" class="name">Redis</text>
    <text x="250" y="594" class="meta">cache · idempotency</text>

    <rect x="430" y="545" width="200" height="64" rx="10" fill="#161B22" stroke="#3FB950" stroke-opacity=".45" stroke-width="1.6"/>
    <text x="450" y="573" class="name">PostgreSQL</text>
    <text x="450" y="594" class="meta">ACID · partitioned</text>

    <rect x="670" y="545" width="180" height="64" rx="10" fill="#161B22" stroke="#3FB950" stroke-opacity=".45" stroke-width="1.6"/>
    <text x="690" y="573" class="name">MongoDB</text>
    <text x="690" y="594" class="meta">documents · audit log</text>
  </g>

  <!-- ─────────── LEGEND ─────────── -->
  <g transform="translate(40,655)">
    <circle cx="6" cy="-5" r="6" fill="#5382A1"/><text x="20" y="0" class="lgd">sync request</text>
    <circle cx="146" cy="-5" r="6" fill="#F89820"/><text x="160" y="0" class="lgd">event published</text>
    <circle cx="306" cy="-5" r="6" fill="#E76F00"/><text x="320" y="0" class="lgd">event consumed</text>
    <circle cx="466" cy="-5" r="6" fill="#3FB950"/><text x="480" y="0" class="lgd">persistence</text>
    <circle cx="606" cy="-5" r="6" fill="#A371F7"/><text x="620" y="0" class="lgd">telemetry</text>
    <text x="1060" y="0" text-anchor="end" class="lgd" fill="#6E7681">JavaBoy · Yassin Ghariani</text>
  </g>
</svg>
