name: Metrics

on:
  schedule:
    - cron: "0 4 * * *"      # daily at 04:00 UTC
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ── Overview card: activity, community, repos ────────────────────────
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics.overview.svg
          base: header, activity, community, repositories
          config_timezone: Africa/Tunis
          config_display: large
          base_indepth: yes

      # ── Languages actually used, weighted by recent commits ──────────────
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics.languages.svg
          base: ""
          config_timezone: Africa/Tunis
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used, recently-used
          plugin_languages_recent_days: 30

      # ── 3D isometric contribution calendar (last 180 days) ───────────────
      - name: Isocalendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics.isocalendar.svg
          base: ""
          config_timezone: Africa/Tunis
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      # ── Coding habits: when and how you commit ───────────────────────────
      - name: Habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics.habits.svg
          base: ""
          config_timezone: Africa/Tunis
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes