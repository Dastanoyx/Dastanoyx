name: Metrics

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ── 1. Overview: activity, community, repos ──────────────────────────
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics.overview.svg
          base: header, activity, community, repositories
          config_timezone: Africa/Tunis
          config_display: large
          base_indepth: yes

      # ── 2. Languages ─────────────────────────────────────────────────────
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics.languages.svg
          base: ""
          config_timezone: Africa/Tunis
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_languages_ignored: jupyter notebook, html, css, scss, dockerfile, shell, makefile
          plugin_languages_analysis_timeout: 15
          plugin_languages_colors: java:F89820

      # ── 3. Isometric contribution calendar ───────────────────────────────
      - name: Isocalendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics.isocalendar.svg
          base: ""
          config_timezone: Africa/Tunis
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Lines and people
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics.lines.svg
          base: ""
          config_timezone: Africa/Tunis
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_people: yes
          plugin_people_limit: 24
          plugin_people_types: followers, following
